<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Hermes and HyperFrames architecture flow</title>
  <desc id="desc">User brief enters Hermes orchestration, which plans scenes and prompts. Hermes writes HyperFrames compositions, which are previewed and rendered into MP4. Feedback loops back into Hermes for revision.</desc>
  <defs>
    <linearGradient id="bggrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" />
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <polygon points="0 0, 12 6, 0 12" fill="#64748b" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 34px 'JetBrains Mono', monospace; fill: #ffffff; }
      .subtitle { font: 400 18px 'JetBrains Mono', monospace; fill: #94a3b8; }
      .box-title { font: 700 24px 'JetBrains Mono', monospace; fill: #ffffff; }
      .box-sub { font: 400 16px 'JetBrains Mono', monospace; fill: #94a3b8; }
      .mini { font: 400 14px 'JetBrains Mono', monospace; fill: #cbd5e1; }
      .note { font: 600 15px 'JetBrains Mono', monospace; fill: #e2e8f0; }
      .legend { font: 500 14px 'JetBrains Mono', monospace; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bggrad)" />
  <rect width="1600" height="980" fill="url(#grid)" opacity="0.45" />

  <circle cx="92" cy="76" r="10" fill="#22d3ee" />
  <text x="120" y="88" class="title">Hermes + HyperFrames Architecture</text>
  <text x="120" y="122" class="subtitle">Prompt in, composition out, video back — with a clean revision loop</text>

  <rect x="70" y="175" width="1460" height="590" rx="24" fill="rgba(251,191,36,0.04)" stroke="#fbbf24" stroke-width="2" stroke-dasharray="10 8" />
  <text x="95" y="205" class="note" fill="#fbbf24">Delivery pipeline</text>

  <g filter="url(#shadow)">
    <rect x="110" y="280" width="250" height="150" rx="18" fill="#0f172a" />
    <rect x="110" y="280" width="250" height="150" rx="18" fill="rgba(30,41,59,0.55)" stroke="#94a3b8" stroke-width="2" />
    <text x="235" y="330" text-anchor="middle" class="box-title">User brief</text>
    <text x="235" y="365" text-anchor="middle" class="box-sub">Topic, tone, duration,</text>
    <text x="235" y="392" text-anchor="middle" class="box-sub">style references</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="425" y="250" width="340" height="210" rx="18" fill="#0f172a" />
    <rect x="425" y="250" width="340" height="210" rx="18" fill="rgba(6,78,59,0.40)" stroke="#34d399" stroke-width="2.5" />
    <text x="595" y="303" text-anchor="middle" class="box-title">Hermes orchestration</text>
    <text x="595" y="340" text-anchor="middle" class="box-sub">Parse brief → plan scenes</text>
    <text x="595" y="368" text-anchor="middle" class="box-sub">Write copy + timing</text>
    <text x="595" y="396" text-anchor="middle" class="box-sub">Generate/edit composition files</text>
    <text x="595" y="432" text-anchor="middle" class="mini">Commands: make • preview • render • revise</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="830" y="250" width="340" height="210" rx="18" fill="#0f172a" />
    <rect x="830" y="250" width="340" height="210" rx="18" fill="rgba(8,51,68,0.40)" stroke="#22d3ee" stroke-width="2.5" />
    <text x="1000" y="303" text-anchor="middle" class="box-title">HyperFrames project</text>
    <text x="1000" y="340" text-anchor="middle" class="box-sub">HTML composition</text>
    <text x="1000" y="368" text-anchor="middle" class="box-sub">Animation + timing rules</text>
    <text x="1000" y="396" text-anchor="middle" class="box-sub">Assets, layout, scene structure</text>
    <text x="1000" y="432" text-anchor="middle" class="mini">This is the inspectable middle layer</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1235" y="250" width="250" height="210" rx="18" fill="#0f172a" />
    <rect x="1235" y="250" width="250" height="210" rx="18" fill="rgba(120,53,15,0.30)" stroke="#fbbf24" stroke-width="2.5" />
    <text x="1360" y="303" text-anchor="middle" class="box-title">Runtime</text>
    <text x="1360" y="340" text-anchor="middle" class="box-sub">Preview</text>
    <text x="1360" y="368" text-anchor="middle" class="box-sub">Validate</text>
    <text x="1360" y="396" text-anchor="middle" class="box-sub">Render MP4</text>
    <text x="1360" y="432" text-anchor="middle" class="mini">HyperFrames CLI + FFmpeg</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1165" y="555" width="320" height="140" rx="18" fill="#0f172a" />
    <rect x="1165" y="555" width="320" height="140" rx="18" fill="rgba(76,29,149,0.40)" stroke="#a78bfa" stroke-width="2.5" />
    <text x="1325" y="607" text-anchor="middle" class="box-title">Artifacts back to user</text>
    <text x="1325" y="642" text-anchor="middle" class="box-sub">Preview link, logs, MP4 path</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="500" y="555" width="400" height="140" rx="18" fill="#0f172a" />
    <rect x="500" y="555" width="400" height="140" rx="18" fill="rgba(136,19,55,0.40)" stroke="#fb7185" stroke-width="2.5" />
    <text x="700" y="607" text-anchor="middle" class="box-title">Revision loop</text>
    <text x="700" y="642" text-anchor="middle" class="box-sub">“Make it less corporate” • “Slow down scene 2”</text>
  </g>

  <line x1="360" y1="355" x2="425" y2="355" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="765" y1="355" x2="830" y2="355" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="1170" y1="355" x2="1235" y2="355" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="1360" y1="460" x2="1360" y2="555" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 1165 625 L 965 625 Q 935 625 915 625 L 900 625" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 500 625 L 340 625 Q 220 625 220 470 L 220 430" fill="none" stroke="#fb7185" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)" />
  <path d="M 700 555 L 700 500 Q 700 475 720 475 L 980 475 Q 1000 475 1000 460" fill="none" stroke="#fb7185" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)" />

  <text x="392" y="340" class="legend">brief</text>
  <text x="795" y="340" class="legend">composition</text>
  <text x="1195" y="340" class="legend">preview/render</text>
  <text x="1378" y="515" class="legend">output</text>
  <text x="930" y="610" class="legend">results</text>
  <text x="270" y="520" class="legend" fill="#fb7185">feedback</text>

  <g transform="translate(92 820)">
    <text x="0" y="0" class="note">Why this split works</text>
    <text x="0" y="36" class="mini">• Hermes plans and edits. HyperFrames previews and renders.</text>
    <text x="0" y="64" class="mini">• The composition stays visible, versionable, and easy to revise.</text>
    <text x="0" y="92" class="mini">• That makes HyperFrames feel easier to aim at an agent than a bigger React-shaped video stack.</text>
  </g>
</svg>
