<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">SQL example execution flow</title>
  <desc id="desc">A clean dark themed flow diagram showing the logical SQL execution order for the example query, from employees through WHERE, GROUP BY, HAVING, SELECT, ORDER BY, and LIMIT.</desc>
  <defs>
    <linearGradient id="bggrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" />
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <polygon points="0 0, 12 6, 0 12" fill="#64748b" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 34px 'JetBrains Mono', monospace; fill: #fff; }
      .subtitle { font: 400 18px 'JetBrains Mono', monospace; fill: #94a3b8; }
      .step { font: 700 22px 'JetBrains Mono', monospace; fill: #fff; }
      .sub { font: 400 15px 'JetBrains Mono', monospace; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1600" height="760" fill="url(#bggrad)" />
  <rect width="1600" height="760" fill="url(#grid)" opacity="0.4" />

  <circle cx="90" cy="74" r="10" fill="#22d3ee" />
  <text x="120" y="86" class="title">Example Flow</text>
  <text x="120" y="120" class="subtitle">How the query moves logically through each stage</text>

  <path d="M 220 410 L 1380 410" stroke="#334155" stroke-width="4" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="120" y="320" width="180" height="180" rx="18" fill="#0f172a" />
    <rect x="120" y="320" width="180" height="180" rx="18" fill="rgba(8,51,68,0.40)" stroke="#22d3ee" stroke-width="2.5" />
    <text x="210" y="388" text-anchor="middle" class="step">1. FROM</text>
    <text x="210" y="420" text-anchor="middle" class="sub">employees</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="330" y="320" width="180" height="180" rx="18" fill="#0f172a" />
    <rect x="330" y="320" width="180" height="180" rx="18" fill="rgba(6,78,59,0.40)" stroke="#34d399" stroke-width="2.5" />
    <text x="420" y="388" text-anchor="middle" class="step">2. WHERE</text>
    <text x="420" y="420" text-anchor="middle" class="sub">active = true</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="540" y="320" width="180" height="180" rx="18" fill="#0f172a" />
    <rect x="540" y="320" width="180" height="180" rx="18" fill="rgba(76,29,149,0.40)" stroke="#a78bfa" stroke-width="2.5" />
    <text x="630" y="388" text-anchor="middle" class="step">3. GROUP BY</text>
    <text x="630" y="420" text-anchor="middle" class="sub">department</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="750" y="320" width="180" height="180" rx="18" fill="#0f172a" />
    <rect x="750" y="320" width="180" height="180" rx="18" fill="rgba(136,19,55,0.40)" stroke="#fb7185" stroke-width="2.5" />
    <text x="840" y="388" text-anchor="middle" class="step">4. HAVING</text>
    <text x="840" y="420" text-anchor="middle" class="sub">COUNT(*) &gt; 5</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="960" y="320" width="180" height="180" rx="18" fill="#0f172a" />
    <rect x="960" y="320" width="180" height="180" rx="18" fill="rgba(251,146,60,0.30)" stroke="#fb923c" stroke-width="2.5" />
    <text x="1050" y="388" text-anchor="middle" class="step">5. SELECT</text>
    <text x="1050" y="420" text-anchor="middle" class="sub">department, total</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1170" y="320" width="160" height="180" rx="18" fill="#0f172a" />
    <rect x="1170" y="320" width="160" height="180" rx="18" fill="rgba(120,53,15,0.30)" stroke="#fbbf24" stroke-width="2.5" />
    <text x="1250" y="388" text-anchor="middle" class="step">6. ORDER BY</text>
    <text x="1250" y="420" text-anchor="middle" class="sub">total DESC</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1360" y="320" width="130" height="180" rx="18" fill="#0f172a" />
    <rect x="1360" y="320" width="130" height="180" rx="18" fill="rgba(30,41,59,0.55)" stroke="#94a3b8" stroke-width="2.5" />
    <text x="1425" y="406" text-anchor="middle" class="step">7. LIMIT</text>
    <text x="1425" y="438" text-anchor="middle" class="sub">3</text>
  </g>
</svg>