<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">SQL Order of Execution</title>
  <desc id="desc">A dark themed flow diagram showing the logical SQL order of execution from FROM and JOIN to LIMIT.</desc>
  <defs>
    <linearGradient id="bggrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" />
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <polygon points="0 0, 12 6, 0 12" fill="#64748b" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 34px 'JetBrains Mono', monospace; fill: #fff; }
      .subtitle { font: 400 18px 'JetBrains Mono', monospace; fill: #94a3b8; }
      .step { font: 700 28px 'JetBrains Mono', monospace; fill: #fff; }
      .sub { font: 400 16px 'JetBrains Mono', monospace; fill: #cbd5e1; }
      .mini { font: 500 14px 'JetBrains Mono', monospace; fill: #94a3b8; }
      .note { font: 600 16px 'JetBrains Mono', monospace; fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="url(#bggrad)" />
  <rect width="1600" height="1100" fill="url(#grid)" opacity="0.4" />

  <circle cx="90" cy="74" r="10" fill="#22d3ee" />
  <text x="120" y="86" class="title">SQL Order of Execution</text>
  <text x="120" y="120" class="subtitle">The database does not read your query top-to-bottom the way you typed it</text>

  <path d="M 220 280 L 1380 280" stroke="#334155" stroke-width="4" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="110" y="200" width="170" height="160" rx="18" fill="#0f172a" />
    <rect x="110" y="200" width="170" height="160" rx="18" fill="rgba(8,51,68,0.40)" stroke="#22d3ee" stroke-width="2.5" />
    <text x="195" y="248" text-anchor="middle" class="step">1. FROM</text>
    <text x="195" y="282" text-anchor="middle" class="step">JOIN</text>
    <text x="195" y="320" text-anchor="middle" class="sub">Choose tables</text>
    <text x="195" y="346" text-anchor="middle" class="sub">and combine rows</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="315" y="200" width="150" height="160" rx="18" fill="#0f172a" />
    <rect x="315" y="200" width="150" height="160" rx="18" fill="rgba(6,78,59,0.40)" stroke="#34d399" stroke-width="2.5" />
    <text x="390" y="265" text-anchor="middle" class="step">2. WHERE</text>
    <text x="390" y="314" text-anchor="middle" class="sub">Filter rows</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="500" y="200" width="170" height="160" rx="18" fill="#0f172a" />
    <rect x="500" y="200" width="170" height="160" rx="18" fill="rgba(76,29,149,0.40)" stroke="#a78bfa" stroke-width="2.5" />
    <text x="585" y="265" text-anchor="middle" class="step">3. GROUP</text>
    <text x="585" y="299" text-anchor="middle" class="step">BY</text>
    <text x="585" y="338" text-anchor="middle" class="sub">Group rows</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="705" y="200" width="170" height="160" rx="18" fill="#0f172a" />
    <rect x="705" y="200" width="170" height="160" rx="18" fill="rgba(136,19,55,0.40)" stroke="#fb7185" stroke-width="2.5" />
    <text x="790" y="265" text-anchor="middle" class="step">4. HAVING</text>
    <text x="790" y="314" text-anchor="middle" class="sub">Filter groups</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="910" y="200" width="150" height="160" rx="18" fill="#0f172a" />
    <rect x="910" y="200" width="150" height="160" rx="18" fill="rgba(251,146,60,0.30)" stroke="#fb923c" stroke-width="2.5" />
    <text x="985" y="265" text-anchor="middle" class="step">5. SELECT</text>
    <text x="985" y="314" text-anchor="middle" class="sub">Pick columns</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1095" y="200" width="170" height="160" rx="18" fill="#0f172a" />
    <rect x="1095" y="200" width="170" height="160" rx="18" fill="rgba(120,53,15,0.30)" stroke="#fbbf24" stroke-width="2.5" />
    <text x="1180" y="265" text-anchor="middle" class="step">6. ORDER</text>
    <text x="1180" y="299" text-anchor="middle" class="step">BY</text>
    <text x="1180" y="338" text-anchor="middle" class="sub">Sort result</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1300" y="200" width="170" height="160" rx="18" fill="#0f172a" />
    <rect x="1300" y="200" width="170" height="160" rx="18" fill="rgba(30,41,59,0.55)" stroke="#94a3b8" stroke-width="2.5" />
    <text x="1385" y="282" text-anchor="middle" class="step">7. LIMIT</text>
    <text x="1385" y="331" text-anchor="middle" class="sub">Trim rows</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="470" width="1360" height="430" rx="24" fill="#0f172a" />
    <rect x="120" y="470" width="1360" height="430" rx="24" fill="rgba(15,23,42,0.5)" stroke="#1e293b" stroke-width="2" />
    <text x="160" y="525" class="note">Example query</text>
    <text x="160" y="570" class="mini">SELECT department, COUNT(*) AS total</text>
    <text x="160" y="600" class="mini">FROM employees</text>
    <text x="160" y="630" class="mini">WHERE active = true</text>
    <text x="160" y="660" class="mini">GROUP BY department</text>
    <text x="160" y="690" class="mini">HAVING COUNT(*) &gt; 5</text>
    <text x="160" y="720" class="mini">ORDER BY total DESC</text>
    <text x="160" y="750" class="mini">LIMIT 3;</text>

    <text x="740" y="525" class="note">How to read it logically</text>
    <text x="740" y="570" class="sub">1. Start from `employees`</text>
    <text x="740" y="605" class="sub">2. Keep only active rows</text>
    <text x="740" y="640" class="sub">3. Group by department</text>
    <text x="740" y="675" class="sub">4. Keep only groups with COUNT(*) &gt; 5</text>
    <text x="740" y="710" class="sub">5. Return department and total</text>
    <text x="740" y="745" class="sub">6. Sort by total descending</text>
    <text x="740" y="780" class="sub">7. Return only the first 3 rows</text>

    <text x="160" y="845" class="note">Quick rule</text>
    <text x="160" y="880" class="sub">`WHERE` filters rows before grouping.</text>
    <text x="620" y="880" class="sub">`HAVING` filters groups after grouping.</text>
  </g>

  <text x="120" y="1015" class="subtitle">If SQL feels weird, it’s usually because you’re reading writing order instead of execution order.</text>
</svg>